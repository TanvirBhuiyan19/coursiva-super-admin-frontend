# Production nginx config for the super-admin SPA (static build in /var/www/super-admin).
# Requires ngx_brotli for `brotli_static` (drop those lines if unavailable; gzip_static is built in).
#
# Caching model:
#   /assets/*   content-hashed file names  -> cache 1 year, immutable (a deploy changes the name)
#   index.html  entry point                 -> never cached, so users always get the latest deploy
#   everything else in the SPA              -> falls back to index.html

server {
  listen 443 ssl;
  http2 on;
  server_name console.coursiva.io;

  root /var/www/super-admin;
  index index.html;

  # Serve the .br / .gz files emitted at build time (no per-request compression cost).
  brotli_static on;
  gzip_static on;
  gzip_vary on;

  # ---- Security headers (the console holds privileged staff sessions) ----
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Inline style attributes are used for one-off layout; scripts are same-origin only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.coursiva.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Source maps are uploaded to error reporting, never served publicly.
  location ~ \.map$ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.coursiva.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
