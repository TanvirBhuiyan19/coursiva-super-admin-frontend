# Production nginx config for the super-admin SPA (static build in /var/www/super-admin).
# Requires ngx_brotli for `brotli_static` (drop those lines if unavailable; gzip_static is built in).
#
# Caching model:
#   /assets/*   content-hashed file names  -> cache 1 year, immutable (a deploy changes the name)
#   index.html  entry point                 -> never cached, so users always get the latest deploy
#   everything else in the SPA              -> falls back to index.html

server {
  listen 443 ssl;
  http2 on;
  # server_name, the API upstream and the CSP host lists: deploy/hosts.conf (the one per-deployment file).
  include /etc/nginx/coursiva/super-admin.hosts.conf;

  root /var/www/super-admin;
  index index.html;

  # Serve the .br / .gz files emitted at build time (no per-request compression cost).
  brotli_static on;
  gzip_static on;
  gzip_vary on;

  # ---- Security headers (the console holds privileged staff sessions) ----
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # One policy, built from the hosts in hosts.conf:
  # - the API is same-origin ('self': /api and /sanctum are proxied below); scripts are same-origin only;
  # - $csp_storage: brand images, signed file/media URLs and presigned uploads; Mux: video playback and thumbnails;
  # - inline style attributes are used for one-off layout.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.mux.com $csp_storage; media-src 'self' blob: https://stream.mux.com $csp_storage; font-src 'self'; connect-src 'self' https://*.mux.com $csp_storage $csp_telemetry; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy $csp always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Source maps are uploaded to error reporting, never served publicly.
  location ~ \.map$ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp always;
  }

  # ---- The API, same-origin: Laravel recognises this app by the Host header (SUPER/TENANT_ADMIN_URL host) ----
  location ~ ^/(api|sanctum)/ {
    proxy_pass $coursiva_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Multipart uploads to the API (REQUEST_MAX_MULTIPART_BYTES); large media goes straight to storage.
    client_max_body_size 100m;
    proxy_read_timeout 75s;
    # Laravel sends its own security headers on API responses; never let a cache keep a session response.
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
