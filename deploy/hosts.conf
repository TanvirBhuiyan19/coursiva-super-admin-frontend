# Deployment-specific hosts for the platform console — the ONLY place they are set (nginx.conf includes this
# file inside its server block). Copy it to /etc/nginx/coursiva/super-admin.hosts.conf and replace the
# example.com placeholders. Nothing else in nginx.conf names a host of yours.

# The console's own host (SUPER_ADMIN_URL in the API's .env must be https://<this host>).
server_name console.example.com;

# Laravel: the API's nginx/PHP-FPM vhost or its load balancer. /api and /sanctum are proxied there on this origin
# (same-origin: Sanctum's session cookie stays first-party). Use an IP:port, or a hostname plus a `resolver` line
# (nginx resolves a variable proxy_pass at request time), e.g. `resolver 127.0.0.53 valid=30s;`.
set $coursiva_api_upstream http://127.0.0.1:8080;

# Content-Security-Policy sources, space-separated origins (wildcards allowed: https://*.example.com).
# Object storage / CDN that serves brand images, exports and signed media URLs (the console's storage
# connection: Cloudflare R2, S3, or a CDN in front of them). Also used for presigned uploads (PUT).
set $csp_storage "https://media.example.com https://*.r2.cloudflarestorage.com";
# Error reporting and real-user monitoring endpoints (VITE_SENTRY_DSN host, VITE_VITALS_ENDPOINT if not same-origin).
# Leave as "" when unused.
set $csp_telemetry "https://*.ingest.sentry.io";
