  /platform/connections/{key}:
    put:
      operationId: putPlatformConnectionsByKey
      tags:
        - Platform
      summary: Connect & verify, or replace credentials
      description: 'Blank or omitted fields keep their stored value; after merging every required field must be set (422 `credentials.{field}`). The server verifies the credentials with the provider before saving (422 `credentials` with its message, e.g. "Stripe rejected these credentials: …"). Needs a password confirmed in the last 15 minutes (423). Payment providers (`kind: payments`: Stripe, Paddle, Lemon Squeezy) also need `billing.manage`. Paddle checks the key and client-side token are one environment and reads the product; Lemon Squeezy checks the store and that each plan/cycle variant is a monthly/yearly subscription of it priced like the price book. Anthropic and AssemblyAI (`kind: ai`) check the key format, then call the provider with it. ClamAV (`kind: security`) checks the host and port, then sends clamd a PING (no PONG → 422 `credentials`: "ClamAV rejected these credentials: no clamd answered PING at {host}:{port}"). The Prometheus scrape token (`kind: monitoring`) is format-checked only (32–256 characters). Daily (`kind: video`) reads the account with the API key (`GET https://api.daily.co/v1/`); an optional pasted domain must be the account’s, and the optional webhook HMAC secret must be base64. Cloudflare’s check proves only "SSL and Certificates: Edit"; the edge also needs Cache Purge, Single Redirect: Edit and Analytics: Read. Cloudflare Registrar (`cloudflare_registrar`) checks the 32-hex account ID and a token of at least 20 characters, then reads the registrar’s extension list (refused → "Cloudflare Registrar rejected these credentials: … (the token needs Registrar: Edit on this account)").'
      parameters:
        - name: key
          in: path
          required: true
          description: "Connection key: `stripe`, `paddle`, `lemon_squeezy`, `cloudflare`, `cloudflare_registrar`, `expo`, `postmark`, `smtp`, `google_ads`, `microsoft_ads`, `google_crux`, `anthropic`, `assemblyai`, `clamav`, `metrics`, `oauth_{provider}`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformConnection"
                additionalProperties: false
        "401":
          description: Not signed in or session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing permission `platform.manage`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "423":
          description: "Confirm the password first: `code` is `password_confirmation_required` (POST /auth/confirm-password, then retry)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sanctumSession: []
      x-permission: platform.manage
      x-audit:
        text: Connected {name} / Updated credentials for {name}
        category: Security
    delete:
      operationId: deletePlatformConnectionsByKey
      tags:
        - Platform
      summary: Disconnect (deletes the stored credentials)
      description: Payment providers also need `billing.manage`. 409 for `paddle` / `lemon_squeezy` while it is the billing provider (Settings → Billing & dunning) or still bills schools (“1 school is still billed through Lemon Squeezy. …”).
      parameters:
        - name: key
          in: path
          required: true
          description: Connection key.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformConnection"
                additionalProperties: false
        "401":
          description: Not signed in or session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing permission `platform.manage`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
