        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "423":
          description: "Confirm the password first: `code` is `password_confirmation_required` (POST /auth/confirm-password, then retry)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
