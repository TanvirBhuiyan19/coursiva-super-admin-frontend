                additionalProperties: false
        "401":
          description: Not signed in or session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing permission `analytics.view`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sanctumSession: []
      x-permission: analytics.view
