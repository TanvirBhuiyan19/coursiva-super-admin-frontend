components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA session. State-changing requests also send `X-XSRF-TOKEN` (from the `XSRF-TOKEN` cookie set by `GET /sanctum/csrf-cookie`).
  schemas:
    AbuseAction:
      type: string
      enum:
        - freeze_checkout
        - raise_limit
        - acknowledge
    AbuseActionResult:
      type: object
      properties:
        signal_id:
          type: string
        outcome:
          type: string
          description: Operator-facing sentence describing what happened.
      required:
        - signal_id
        - outcome
      additionalProperties: false
      description: Result of applying a signal's recommended action.
    AbuseSignal:
      type: object
      properties:
        id:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        tenant_id:
          type: string
        tenant_name:
          type: string
        signal:
          type: string
        action:
          $ref: "#/components/schemas/AbuseAction"
          description: Recommended action, e.g. `freeze_checkout`.
        action_label:
          type: string
        detected_at:
          type: string
      required:
        - id
        - severity
        - tenant_id
        - tenant_name
        - signal
        - action
        - action_label
        - detected_at
      additionalProperties: false
    Addon:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        price:
          type: number
        availability:
          type: string
      required:
        - key
        - label
        - price
        - availability
      additionalProperties: false
    AiFeature:
      type: string
      enum:
        - outlines
        - quizzes
        - summaries
        - chat
    AiSettingsInput:
      type: object
      properties:
        monthly_cap:
          type: number
        routing_policy:
          $ref: "#/components/schemas/RoutingPolicy"
      additionalProperties: false
    AiTenantUsage:
      type: object
      properties:
        tenant_id:
          type: string
        name:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
        tokens_k:
          type: number
        allowance_k:
          type: number
        cost:
          type: number
          description: Our model cost this month (USD).
        billed:
          type: number
          description: Overage billed to the tenant above their allowance (USD).
        model_cost:
          type: number
          description: What this tenant's model calls really cost this month (USD, rounded to cents).
        margin_pct:
          type:
            - number
            - "null"
          description: (plan MRR + billed − cost) ÷ revenue, in %. Null when the tenant has no revenue (trial / suspended).
        top_feature:
          $ref: "#/components/schemas/AiFeature"
        throttled:
          type: boolean
      required:
        - tenant_id
        - name
        - plan
        - tokens_k
        - allowance_k
        - cost
        - billed
        - model_cost
        - margin_pct
        - top_feature
        - throttled
      additionalProperties: false
    AiUsage:
      type: object
      properties:
        settings:
          type: object
          properties:
            monthly_cap:
              type: number
            routing_policy:
              $ref: "#/components/schemas/RoutingPolicy"
          required:
            - monthly_cap
            - routing_policy
          additionalProperties: false
        pricing:
          type: object
          properties:
            cost_per1k:
              type: number
            billed_per1k:
              type: number
            allowances:
              type: array
              items:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
                  tokens_k:
                    type: number
                required:
                  - plan
                  - tokens_k
                additionalProperties: false
          required:
            - cost_per1k
            - billed_per1k
            - allowances
          additionalProperties: false
          description: Server pricing rules, so the explanation on screen always matches the maths.
        totals:
          type: object
          properties:
            spend:
              type: number
            tokens_k:
              type: number
            tenants:
              type: number
            throttled:
              type: number
            model_cost:
              type: number
              description: What the model calls really cost this month (USD), summed from each charge — beside `spend`, the credit cost.
            cap_used_pct:
              type: number
          required:
            - spend
            - tokens_k
            - tenants
            - throttled
            - model_cost
            - cap_used_pct
          additionalProperties: false
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/AiTenantUsage"
        by_feature:
          type: array
          items:
            type: object
            properties:
              feature:
                $ref: "#/components/schemas/AiFeature"
              cost:
                type: number
              share_pct:
                type: number
            required:
              - feature
              - cost
              - share_pct
            additionalProperties: false
          description: Our cost by AI feature, largest first. `sharePct` of total spend.
      required:
        - settings
        - pricing
        - totals
        - tenants
        - by_feature
      additionalProperties: false
    Announcement:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        audience:
          anyOf:
            - $ref: "#/components/schemas/AnnouncementAudience"
            - $ref: "#/components/schemas/BroadcastOnlyAudience"
        channel:
          $ref: "#/components/schemas/AnnouncementChannel"
        recipients:
          type: number
          description: Tenants the announcement reached when it was sent (suspended tenants are skipped).
        sent_at:
          type: string
        sent_by:
          type: string
      required:
        - id
        - message
        - audience
        - channel
        - recipients
        - sent_at
        - sent_by
      additionalProperties: false
    AnnouncementAudience:
      type: string
      enum:
        - All tenants
        - Launch plan
        - Growth plan
        - Scale plan
    AnnouncementChannel:
      type: string
      enum:
        - Banner
        - Email
        - In-app
    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Masked prefix, e.g. `sk_live_••••4f2a`. The full secret is never returned after creation.
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
        last_used_at:
          type:
            - string
            - "null"
        revoked_at:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - prefix
        - scope
        - created_at
        - last_used_at
        - revoked_at
      additionalProperties: false
    ApiKeyInput:
      type: object
      properties:
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
      required:
        - name
        - scope
      additionalProperties: false
    ApiKeyScope:
      type: string
      enum:
        - Full access
        - Read only
    AssignableRole:
      type: string
      enum:
        - Admin
        - Support
        - Finance
        - Read-only
    AudienceReach:
      type: object
      properties:
        audience:
          $ref: "#/components/schemas/AnnouncementAudience"
        tenants:
          type: number
      required:
        - audience
        - tenants
      additionalProperties: false
    AuditCategory:
      type: string
      enum:
        - Tenants
        - Billing
        - Flags
        - Security
        - Auth
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
        actor_id:
          type:
            - string
            - "null"
        actor_name:
          type: string
          description: '"System" for automated entries.'
        action:
          type: string
        category:
          $ref: "#/components/schemas/AuditCategory"
        tenant_id:
          type:
            - string
            - "null"
        ip:
          type:
            - string
            - "null"
      required:
        - id
        - created_at
        - actor_id
        - actor_name
        - action
        - category
        - tenant_id
        - ip
      additionalProperties: false
    Availability:
      type: object
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityGroup"
      required:
        - capabilities
        - groups
      additionalProperties: false
      description: "`GET /platform/availability`. Groups are in display order."
    AvailabilityUpdate:
      type: object
      properties:
        on:
          type: boolean
      required:
        - on
      additionalProperties: false
      description: "`PUT /platform/availability/{key}`."
    BackupActivity:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
        text:
          type: string
      required:
        - id
        - created_at
        - text
      additionalProperties: false
    BackupDestination:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: string
        status:
          type: string
        healthy:
          type: boolean
      required:
        - id
        - name
        - size
        - status
        - healthy
      additionalProperties: false
    BackupFrequency:
      type: string
      enum:
        - hourly_nightly
        - nightly
        - six_hourly_nightly
    BackupKind:
      type: string
      enum:
        - Full
        - Incremental
        - Manual
    BackupPoint:
      type: object
      properties:
        id:
          type: string
        taken_at:
          type: string
        kind:
          $ref: "#/components/schemas/BackupKind"
        label:
          type:
            - string
            - "null"
          description: Operator note for manual snapshots, e.g. "before pricing migration".
        size_gb:
          type: number
        integrity:
          type: string
          enum:
            - Verified
            - Verifying
            - Failed
      required:
        - id
        - taken_at
        - kind
        - label
        - size_gb
        - integrity
      additionalProperties: false
    BackupSettings:
      type: object
      properties:
        frequency:
          $ref: "#/components/schemas/BackupFrequency"
        nightly_window:
          type: string
          description: Nightly full backup start, HH:MM UTC.
        retention_days:
          type: number
          description: Days to keep nightly backups (7–365); weekly copies are then kept for 12 months.
        replication:
          type: boolean
        worm:
          type: boolean
          description: "Immutability lock: backups can't be altered or deleted for 30 days."
      required:
        - frequency
        - nightly_window
        - retention_days
        - replication
        - worm
      additionalProperties: false
    BackupSettingsUpdate:
      type: object
      properties:
        frequency:
          $ref: "#/components/schemas/BackupFrequency"
        nightly_window:
          type: string
          description: Nightly full backup start, HH:MM UTC.
        retention_days:
          type: number
          description: Days to keep nightly backups (7–365); weekly copies are then kept for 12 months.
        replication:
          type: boolean
        worm:
          type: boolean
          description: "Immutability lock: backups can't be altered or deleted for 30 days."
      additionalProperties: false
      description: "PATCH /backup/settings body: any subset of the policy."
    BackupSummary:
      type: object
      properties:
        last_backup_at:
          type:
            - string
            - "null"
        last_backup_verified:
          type: boolean
        protected_gb:
          type: number
        history_tb:
          type: number
        tenants:
          type: number
        rpo_minutes:
          type: number
        rto_minutes:
          type:
            - number
            - "null"
          description: From the last live restore or passed drill; null until either has happened.
        drills_passed:
          type: number
        drills_total:
          type: number
        last_drill_at:
          type:
            - string
            - "null"
        wal_window_days:
          type: number
          description: Days of continuous transaction log (WAL) available for point-in-time recovery.
