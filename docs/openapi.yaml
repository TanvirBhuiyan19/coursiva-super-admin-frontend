# Generated by scripts/openapi.ts — do not edit. Run `npm run openapi`.
openapi: 3.1.0
info:
  title: Coursiva Platform Console API
  version: 0.1.0
  description: |-
    Admin API for the Coursiva platform console (Laravel). Generated from the frontend contract — do not edit by hand; run `npm run openapi`.

    Conventions: snake_case JSON; `{ data }` resources; `{ data, meta }` pagination; 422 `{ message, errors }`; ISO-8601 UTC timestamps; USD amounts. Auth is a Laravel Sanctum SPA session cookie plus the `X-XSRF-TOKEN` header. Every endpoint enforces its `x-permission`; the server writes the `x-audit` entry on success. See docs/api/README.md.
servers:
  - url: https://api.coursiva.io/api/v1/admin
    description: Production
  - url: http://localhost:8000/api/v1/admin
    description: Local Laravel
tags:
  - name: Analytics
    description: Growth, usage, system health, AI cost and experiment analytics. Tenant figures are derived from the tenant table.
  - name: Announcements
    description: Broadcasts to tenant admins (banner, email or in-app). Suspended tenants are never reached.
  - name: Audit
    description: Append-only audit trail. Entries are written server-side by other endpoints; there is no create endpoint.
  - name: Auth
    description: Laravel Sanctum SPA session with Fortify-style two-factor authentication and password confirmation.
  - name: Backup
    description: Platform backups, point-in-time recovery, two-person restores, backup policy and per-tenant data exports. Restores move `staged` → `approved` → `running` → `completed` (or `staged` → `cancelled`) on the server.
  - name: Billing
    description: Revenue, invoices and dunning, usage overages, plans & pricing, and promo codes.
  - name: Entitlements
    description: Module × plan entitlement matrix and plan limits. Overrides are stored per module and plan; the API always exchanges arrays of cells.
  - name: Extensions
    description: "Paid extension catalogue: prices, visibility, plan inclusion, the all-access bundle and selling rules."
  - name: Governance
    description: Compliance & privacy (DSARs, retention, sub-processors), trust & moderation, policies & terms, data residency, abuse signals, rate limits and IP blocks.
  - name: Media
    description: "Platform media settings: live-room policies and allowances, video DRM and providers, storage & delivery backends."
  - name: Overview
    description: Dashboard headline numbers. Figures only — the client applies labels and colour bands.
  - name: Platform
    description: Feature flags, system status & incidents, email deliverability, certificate registry, standards imports, API keys and webhooks.
  - name: Settings
    description: "Platform-wide configuration: general, security and notification settings, the integration marketplace, and tax & invoicing."
  - name: Shell
    description: "Console-wide endpoints: status pill, navigation badges, notifications and global search."
  - name: Staff
    description: Platform staff (the console login users), invitations, access reviews, just-in-time elevation and role permissions. Nobody can change their own role or scope, suspend/reinstate/elevate themselves or confirm their own review; Owner accounts cannot be changed here (422).
  - name: Support
    description: "Tenant support inbox: tickets, replies and internal notes, SLA tracking and tenant context."
  - name: Tenants
    description: Tenant directory, provisioning and per-tenant administration.
paths:
