    post:
      operationId: postAnnouncements
      tags:
        - Announcements
      summary: Send an announcement
      description: Message is trimmed and must be 1–500 characters. `recipients` is the audience reach at send time. Requires a password confirmed in the last 15 minutes (423 `password_confirmation_required`). The console asks for a typed confirmation naming the reach first.
      requestBody:
        required: true
        content:
