      required:
        - open_dsars
        - overdue_dsars
        - nearest_due_at
        - sub_processors
        - dpas_signed
        - tenants
      additionalProperties: false
    Connection:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        role:
          type:
            - string
            - "null"
          description: Role label for storage backends, e.g. "Hot delivery".
        connected:
          type: boolean
        verified_at:
          type:
            - string
            - "null"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CredentialField"
      required:
        - key
        - name
        - description
        - role
        - connected
        - verified_at
        - fields
      additionalProperties: false
    CreatedApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
