        - fields
      additionalProperties: false
      description: "`GET /settings/meta` as Laravel sends it: `key` is a snake_case *value* (`public_signup`), which the API client doesn't convert (it camelises object keys only). `useSettingsMeta` maps it to `SettingsMeta`."
    SettingsSection:
      type: string
      enum:
        - platform
        - signup
        - branding
        - legal
        - email
        - security
        - billing
        - notifications
        - maintenance
      description: Sections of `PlatformSettings` (each has its own Save, Restore defaults and "where these values are read").
