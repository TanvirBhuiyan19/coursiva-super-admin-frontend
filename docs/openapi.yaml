    post:
      operationId: postTenantsBulk
      tags:
        - Tenants
      summary: Bulk action on tenants
      description: "`suspend` requires `tenants.suspend` and a password confirmed in the last 15 minutes (423 `password_confirmation_required`; up to 200 schools go offline at once). `watch` and `export` need no step-up."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - ids
              properties:
                action:
                  type: string
                  enum:
                    - suspend
                    - watch
                    - export
                ids:
                  type: array
                  items:
                    type: string
      responses:
