        - Low
    SlaState:
      type: string
      enum:
        - on_track
        - at_risk
        - breached
        - responded
        - overdue
        - paused
        - resolved
      description: |-
        SLA position, computed server-side from `created_at`, the first staff reply and the priority target (first reply: High 60 min · Medium 240 min · Low 480 min; resolution: 24 h).
        - `on_track` / `at_risk` (< 60 min left) / `breached` — awaiting the first reply; `sla_due_at` is the first-reply deadline.
        - `responded` / `overdue` — replied; `sla_due_at` is the resolution deadline.
        - `paused` — Pending (waiting on the tenant); the clock is stopped.
        - `resolved` — closed.
