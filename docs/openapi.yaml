    Usage:
      type: object
      properties:
        period:
          type: string
          description: First day of the billing month the figures cover (ISO date).
        capacity:
          type: array
          items:
            type: object
            properties:
              meter:
                $ref: "#/components/schemas/UsageMeter"
              used:
                type: number
              capacity:
                type: number
              used_pct:
                type: number
              near_limit:
                type: boolean
            required:
              - meter
              - used
              - capacity
              - used_pct
              - near_limit
            additionalProperties: false
          description: "Platform capacity. Units: `storage` and `bandwidth` in GB, `transcode` in minutes, `api_requests` in requests. `used` is the sum over all tenants. `nearLimit` when used ≥ 80% of capacity."
        top_consumers:
          type: array
          items:
            type: object
            properties:
              tenant_id:
                type: string
              name:
                type: string
              storage_gb:
                type: number
              bandwidth_gb:
                type: number
              video_minutes:
                type: number
              api_requests:
                type: number
              share_pct:
                type: number
              overage:
                anyOf:
                  - type: object
                    properties:
                      meter:
                        type: string
                      amount:
                        type: number
                    required:
                      - meter
                      - amount
                    additionalProperties: false
                  - type: "null"
                description: Unbilled overage on the tenant, if any.
            required:
              - tenant_id
              - name
              - storage_gb
              - bandwidth_gb
              - video_minutes
              - api_requests
              - share_pct
              - overage
            additionalProperties: false
          description: Top 5 tenants by share of platform usage (mean of their share of each meter).
      required:
        - period
        - capacity
        - top_consumers
      additionalProperties: false
    UsageMeter:
      type: string
      enum:
        - storage
        - bandwidth
        - transcode
        - api_requests
