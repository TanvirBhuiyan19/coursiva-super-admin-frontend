          type:
            - string
            - "null"
        verify_url:
          type: string
      required:
        - id
        - learner_name
        - tenant_id
        - tenant_name
        - course
        - issued_at
        - status
        - revoked_at
        - verify_url
      additionalProperties: false
    CertificateSummary:
      type: object
      properties:
        issued:
          type: number
        verified30d:
          type: number
        revoked:
          type: number
        orphaned:
          type: number
      required:
        - issued
        - verified30d
        - revoked
        - orphaned
      additionalProperties: false
    ComplianceSummary:
      type: object
      properties:
        open_dsars:
          type: number
        overdue_dsars:
          type: number
        nearest_due_at:
          type:
            - string
            - "null"
