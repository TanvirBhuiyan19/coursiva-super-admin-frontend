          type: boolean
        two_factor_setup_required:
          type: boolean
          description: "The platform requires staff 2FA (`require_staff_two_factor`) and this member has none: every route but `auth/*` answers 403 `two_factor_setup_required` until they enrol, so the console keeps them on Account → Security."
