  /auth/confirm-password:
    post:
      operationId: postAuthConfirmPassword
      tags:
        - Auth
      summary: Unlock an idle-locked console (password confirmation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        "204":
          description: No content.
        "401":
          description: Not signed in or session expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      security:
        - sanctumSession: []
      x-permission: authenticated
      x-audit:
        text: Confirmed their password
        category: Auth
  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags:
        - Auth
      summary: Email a password reset link
      description: 'Always `{ sent: true }` with `message` "If an account exists for that email, we sent a link to reset the password." (no account enumeration). At most one email a minute per address; suspended accounts get none. The link is `{console}/reset-password?token&email`, single use, valid 60 minutes. Rate-limited (429).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PasswordResetSent"
                additionalProperties: false
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Too many attempts — throttled; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
        - Auth
      summary: Sign in with email and password
      description: "When the account has 2FA, returns `two_factor_required: true` and the session holds the pending user until the challenge. Rate-limit per email + IP."
      requestBody:
        required: true
        content:
